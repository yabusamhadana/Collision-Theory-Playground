<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collision Theory Playground</title>
<style>
:root{--bg:#eaf1f4;--panel:#f8fbfc;--ink:#13242e;--mute:#566b77;--line:#c6d6dd;--a:#0b8a8a;--b:#c47f00;--c:#7a3fb0;--ok:#1d7a3e;--bad:#b3342b;--invert:#f8fbfc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a20;--panel:#16252d;--ink:#e6f0f4;--mute:#92a8b3;--line:#2b414c;--a:#3cc8c8;--b:#f0b43a;--c:#b583e6;--ok:#58c47c;--bad:#f07a70;--invert:#0f1a20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a20;--panel:#16252d;--ink:#e6f0f4;--mute:#92a8b3;--line:#2b414c;--a:#3cc8c8;--b:#f0b43a;--c:#b583e6;--ok:#58c47c;--bad:#f07a70;--invert:#0f1a20;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1080px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:600 clamp(24px,4vw,34px)/1.15 Georgia,serif;margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 14px;max-width:62ch}
h2{font:600 16px Georgia,serif;margin:12px 0 6px}
.a{color:var(--a)}.b{color:var(--b)}.c{color:var(--c)}
button{font:inherit;font-size:14px;padding:7px 12px;border-radius:6px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.p{background:var(--ink);color:var(--invert)}
button:focus-visible,input:focus-visible{outline:3px solid var(--c);outline-offset:2px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 14px;color:var(--mute);font-size:16px}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--c);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .sp{flex:1}
.box,.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.q{margin-bottom:12px}
.q .t{font-size:13px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.q .t button{font-size:13px;padding:3px 8px;border-color:var(--line);color:var(--mute)}
.q p{margin:6px 0 10px;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin-bottom:6px;border-color:var(--line)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.opt:disabled{cursor:default;color:var(--ink)}
.exp{font-size:14px;color:var(--mute);margin-top:6px}
.score{font-size:15px;color:var(--mute)}
.boxes{display:grid;gap:14px}
.boxes.two{grid-template-columns:1fr 1fr}
.boxes.one .box{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.boxes.two,.boxes.one .box{grid-template-columns:1fr}}
.boxes .box>div{min-width:0}
canvas{width:100%;height:auto;display:block;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;font-size:13px;color:var(--mute)}
.stats b{display:block;font-size:20px;color:var(--ink);font-weight:600}
label{display:block;font-size:14px;margin:10px 0 0}
label span{float:right;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--c)}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.chk label{margin:0}
.cap{font-size:13px;color:var(--mute);margin:4px 0 0}
:root{--bg:#fff;--panel:#fff;--ink:#111;--mute:#666;--line:#e3e3e3;--a:#2563eb;--b:#d97706;--c:#111;--ok:#15803d;--bad:#b91c1c;--invert:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--panel:#000;--ink:#fff;--mute:#999;--line:#2a2a2a;--a:#6ea0ff;--b:#ffa940;--c:#fff;--ok:#4ade80;--bad:#f87171;--invert:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--panel:#000;--ink:#fff;--mute:#999;--line:#2a2a2a;--a:#6ea0ff;--b:#ffa940;--c:#fff;--ok:#4ade80;--bad:#f87171;--invert:#000;color-scheme:dark}
body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,b,.eq,summary{font-family:inherit}
main{max-width:1040px;padding:28px 20px 56px}
header{align-items:center;margin-bottom:12px}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:15px;font-weight:600;margin:20px 0 8px}
h2.sec{font-size:18px;margin:0}
.bar{margin-bottom:16px}
nav{margin-bottom:24px}
nav button{font-size:15px;padding:10px 0;margin-right:24px;border-bottom:2px solid transparent}
nav button[aria-selected=true]{border-bottom-color:var(--ink);font-weight:600}
.box,.q{background:transparent;border-radius:8px}
button{border-color:var(--line);border-radius:6px;padding:7px 14px}
button:hover:not(:disabled){border-color:var(--ink)}
button.p{background:var(--ink);color:var(--invert);border-color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input[type=range],input[type=checkbox]{accent-color:var(--ink)}
canvas{border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.stats b{font-weight:600}
.rx{font-weight:600}
summary{cursor:pointer}
.q .t button{border-color:var(--line)}
</style>
</head>
<body>
<main>
<header>
<h1>Collision Theory Playground</h1>
<button id="th" aria-label="Switch between light and dark theme">Dark mode</button>
</header>
<nav role="tablist">
<button role="tab" id="t1" aria-selected="true" aria-controls="p1">Practice</button>
<button role="tab" id="t2" aria-selected="false" aria-controls="p2">Simulate</button>
</nav>

<section id="p1" role="tabpanel" aria-labelledby="t1">
<div class="bar"><h2 class="sec">Practice questions</h2><span class="sp"></span><span class="score" id="score"></span><button class="p" id="rr">Reroll all questions</button></div>
<div id="qs"></div>
</section>

<section id="p2" role="tabpanel" aria-labelledby="t2" hidden>
<div class="bar">
<h2 class="sec">Simulation</h2><span class="rx"><span class="a">A</span> + <span class="b">B</span> → <span class="c">2C</span></span><span class="sp"></span>
<label style="margin:0" for="spd">Speed <span id="spv" style="float:none;margin-left:4px"></span></label>
<input id="spd" type="range" min="1" max="6" value="2" style="width:100px">
<button id="pz">Pause</button><button id="ra">Restart</button><button class="p" id="add">Add second box</button>
</div>
<details class="box" id="cu" style="margin-bottom:14px"><summary><b>Orientation close-up</b>: rotate two molecules and see whether a collision can react</summary>
<canvas id="cuc" width="560" height="170" aria-label="Orientation close-up" style="margin-top:10px"></canvas>
<label for="cuA">Rotate A <span id="cuAv"></span></label><input id="cuA" type="range" min="0" max="359" value="0">
<label for="cuB">Rotate B <span id="cuBv"></span></label><input id="cuB" type="range" min="0" max="359" value="180">
<p class="cap" id="cuv" aria-live="polite"></p><p class="cap">The thick arc on each molecule is its reactive site. Its width follows the site half-angle slider in Box 1.</p></details>
<div class="boxes one" id="boxes"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const COL={};
function colors(){const g=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();['a','b','c','ink','mute','line','invert'].forEach(k=>COL[k]=g('--'+k))}
function setTheme(t){document.documentElement.dataset.theme=t;$('th').textContent=t==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('cpg-theme',t)}catch(e){}colors()}
let saved=null;try{saved=localStorage.getItem('cpg-theme')}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('th').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ---------- Practice ---------- */
const Q={
"Temperature":[
["Why does a 10 K rise in temperature often roughly double a reaction rate?",["Collisions become about twice as frequent","A much larger fraction of collisions exceeds Ea","The activation energy drops","Every collision gets the right orientation"],1,"Collision frequency grows only with √T (a couple of percent per 10 K). The fraction of collisions with energy ≥ Ea grows exponentially, and that dominates."],
["In a Maxwell–Boltzmann distribution of collision energies, raising T does what?",["Shifts the peak right and fattens the high-energy tail","Lowers the peak and moves Ea left","Keeps the shape and shifts the whole curve left","Narrows the curve around the average"],0,"The distribution broadens and shifts right, so the area beyond Ea, the fraction that can react, increases."]],
"Concentration":[
["For rate = k[A]², tripling [A] at constant T changes the rate by what factor?",["3","6","9","No change"],2,"Rate ∝ [A]², so 3² = 9. The rate constant k does not change with concentration."],
["Why does a higher reactant concentration speed up a reaction at constant T?",["It lowers Ea","It raises k","More collisions per second, with the same fraction energetic","A larger share of collisions exceeds Ea"],2,"More particles per volume means more collisions per second. The energy distribution, Ea, and k are unchanged."]],
"Catalysts":[
["How does a catalyst speed up a reaction?",["It supplies an alternate pathway with lower Ea","It raises the temperature locally","It shifts equilibrium toward products","It lowers ΔH of the reaction"],0,"A catalyst lowers Ea through a different mechanism. ΔH and the equilibrium position are unchanged."],
["Reactions A (Ea = 50 kJ/mol) and B (Ea = 80 kJ/mol) have the same pre-exponential factor and temperature. Which is faster?",["A, because a larger fraction of collisions exceeds Ea","B, because high-Ea reactions are more energetic","They match, because T is the same","Cannot tell without ΔH"],0,"Rate ∝ e^(−Ea/RT). A lower Ea means a larger fraction of collisions are energetic enough."]],
"Orientation":[
["Why doesn’t every collision with energy ≥ Ea produce a reaction?",["Collisions also need a suitable orientation","Energy is lost to the walls","Ea changes during each collision","Only collisions between identical particles react"],0,"Reacting atoms must meet in the right geometry. This is the steric factor, part of the pre-exponential factor A."],
["In the simulation, requiring correct orientation mainly changes what?",["Ea, which gets smaller","The pre-exponential factor, so rate falls at every T","The temperature of the box","Only the product’s identity"],1,"Orientation scales how many energetic collisions succeed, which is the factor A. Ea stays the same."]],
"Arrhenius":[
["In an Arrhenius plot of ln k vs 1/T, the slope equals:",["−Ea/R","+Ea/R","−Ea·R","ln A"],0,"ln k = ln A − (Ea/R)(1/T), a line with slope −Ea/R and intercept ln A."],
["Temperature rises from 300 K to 310 K. Which rate changes more?",["Reaction with Ea = 100 kJ/mol","Reaction with Ea = 20 kJ/mol","Both the same, since ΔT is equal","Neither, T only affects gases"],0,"d(ln k)/dT = Ea/RT², so a higher Ea means greater temperature sensitivity."]],
"Physical state":[
["A solid reactant is ground to a powder. The rate increases because:",["Ea is lower","More surface is exposed, so more collisions can occur","The solid’s concentration rises","The products are more stable"],1,"A heterogeneous reaction occurs at the surface. More surface area gives more collision sites; Ea is unchanged."],
["A gas-phase reaction mixture is compressed to half its volume at constant T. The rate:",["Increases, since concentrations double","Decreases, since particles are crowded","Stays the same, since T is fixed","Drops to zero"],0,"Halving the volume doubles every concentration, so collision frequency rises and so does the rate."]],
"Rate laws":[
["A first-order reaction has t½ = 10 min. What fraction remains after 30 min?",["1/3","1/6","1/8","1/9"],2,"30 min is three half-lives: (1/2)³ = 1/8. First-order half-life is independent of concentration."],
["For a second-order reaction in A, the half-life:",["Is constant","Doubles with each successive half-life","Halves with each successive half-life","Is independent of k"],1,"t½ = 1/(k[A]₀). As [A] falls, each successive half-life is longer, doubling each time."]],
"Mechanisms":[
["The rate law of a multistep reaction is set by:",["The fastest step","The rate-determining (slowest) step","The overall ΔH","The last step"],1,"The slowest step is the bottleneck. Its molecularity, with any earlier fast steps, determines the observed rate law."],
["A species formed in one step and consumed in a later step is a(n):",["Catalyst","Intermediate","Reactant","Spectator ion"],1,"Intermediates are formed then consumed. A catalyst is consumed early and regenerated, so it appears in the mechanism but not the net equation."]]
};
const X={
"Temperature":[
["Which statement about raising the temperature is true for a typical reaction?",["It increases k for both endothermic and exothermic reactions","It decreases k for exothermic reactions","It increases k only for endothermic reactions","It changes concentrations but not k"],0,"In k = Ae^(−Ea/RT), k rises with T whenever Ea > 0, whatever the sign of ΔH."],
["If T doubles (in kelvin) and Ea stays fixed, the fraction e^(−Ea/RT) becomes:",["Twice as large","The square root of its original value","Unchanged","Half as large"],1,"e^(−Ea/2RT) = (e^(−Ea/RT))^(1/2), the square root of the original fraction. Since the fraction is below 1, that is a larger number."]],
"Concentration":[
["For a zero-order reaction in A, doubling [A] changes the rate by:",["No change","×2","×4","×½"],0,"Rate = k[A]⁰ = k, so the rate does not depend on [A]."],
["What are the units of k for a second-order reaction (M and s)?",["s⁻¹","M s⁻¹","M⁻¹ s⁻¹","M⁻² s⁻¹"],2,"Rate (M/s) = k[A]², so k = (M/s)/M² = M⁻¹ s⁻¹."]],
"Catalysts":[
["A catalyst is added to A ⇌ B at equilibrium. The equilibrium constant:",["Is unchanged, since both directions speed up","Increases","Decreases","Becomes infinite"],0,"A catalyst lowers Ea for forward and reverse reactions equally, so K = kf/kr is unchanged. Equilibrium is just reached sooner."],
["A catalyst lowers Ea of the forward reaction by 20 kJ/mol. The reverse reaction’s Ea:",["Also drops by 20 kJ/mol","Rises by 20 kJ/mol","Is unchanged","Drops by 40 kJ/mol"],0,"The catalyzed pathway lowers the transition state relative to both reactants and products, so both barriers fall by the same amount."]],
"Orientation":[
["In the close-up, a high-energy collision bounces off without reacting. The most likely reason is:",["The reactive sites did not face each other","Ea increased","The molecules were too heavy","The temperature was too low to collide"],0,"Energy is necessary but not sufficient. If the reactive sites miss, there is no reaction."],
["Narrowing the reactive site in the simulation should:",["Lower the steric factor and the effective percentage, with Ea unchanged","Raise Ea","Raise the collision rate","Have no effect"],0,"A narrower site means fewer collisions line up, so the pre-exponential factor drops. Ea is a property of the energy barrier, not the geometry."]],
"Arrhenius":[
["The y-intercept of an Arrhenius plot (ln k vs 1/T) equals:",["ln A","−Ea/R","Ea","ln Ea"],0,"At 1/T = 0, ln k = ln A."],
["A reaction has Ea = 0. How does k depend on T?",["It doubles every 10 K","It does not depend on T","It decreases with T","It grows as e^T"],1,"With Ea = 0, e^(−Ea/RT) = 1, so k = A at every temperature."]],
"Physical state":[
["Which change would NOT speed up a solid–gas surface reaction?",["Grinding the solid to powder","Raising the gas pressure","Raising the temperature","Using one large chunk instead of many small ones"],3,"One big chunk has less surface area per mass, so fewer collision sites."],
["Why are reactions between ions in solution often much faster than between mixed solids?",["Ions move freely and collide throughout the mixture","Solutions have lower Ea","Solids are always unreactive","Water is a catalyst for every reaction"],0,"In solid mixtures, reactants only meet at contact surfaces. Dissolved species mix at the particle level."]],
"Rate laws":[
["Doubling [A] doubles the initial rate, and doubling [B] quadruples it. The rate law is:",["k[A]²[B]","k[A][B]²","k[A][B]","k[A]²[B]²"],1,"Order in A: 2¹ = 2, so first order. Order in B: 2² = 4, so second order."],
["A plot of ln[A] vs time is a straight line. The reaction is:",["Zero order","First order","Second order","Cannot be determined"],1,"Integrated first-order law: ln[A] = ln[A]₀ − kt. Zero order plots [A] vs t, and second order plots 1/[A] vs t."]],
"Mechanisms":[
["Step 1: A + B → C (slow). Step 2: C + B → D (fast). The rate law is:",["k[A][B]","k[C][B]","k[A][B]²","k[D]"],0,"The slow first step is rate-determining, and its reactants are A and B."],
["Why can’t you always write the rate law from the balanced overall equation?",["Orders must be found by experiment, since they depend on the mechanism","Balanced equations are often wrong","Rate laws use only products","Coefficients never matter"],0,"The overall equation shows stoichiometry, not the elementary steps that control the rate."]]
};
Object.keys(X).forEach(t=>Q[t].push(...X[t]));const other=(t,v)=>{let n;do{n=Math.floor(Math.random()*Q[t].length)}while(n===v);return n};
const topics=Object.keys(Q);let set=[];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(t,v){const [q,o,a,e]=Q[t][v],ix=shuf(o.map((_,i)=>i));return{t,v,q,o:ix.map(i=>o[i]),a:ix.indexOf(a),e,pick:-1}}
function roll(){set=shuf(topics).map(t=>mk(t,Math.floor(Math.random()*Q[t].length)));renderQ()}
function renderQ(){
  const box=$('qs');box.innerHTML='';
  set.forEach((x,i)=>{
    const d=document.createElement('div');d.className='q';
    d.innerHTML=`<div class="t"><span>${x.t}</span><button data-s="${i}">Swap question</button></div><p>${x.q}</p>`+
    x.o.map((o,k)=>{const st=x.pick<0?'':k===x.a?' ok':k===x.pick?' no':'';return `<button class="opt${st}" data-i="${i}" data-k="${k}"${x.pick>=0?' disabled':''}>${o}</button>`}).join('')+
    (x.pick>=0?`<div class="exp"><b>${x.pick===x.a?'Correct.':'Not quite.'}</b> ${x.e}</div>`:'');
    box.appendChild(d)});
  const n=set.filter(x=>x.pick>=0).length,c=set.filter(x=>x.pick===x.a).length;
  $('score').textContent=n===set.length?`Done: ${c} of ${set.length} correct`:`Answered ${n} of ${set.length}`+(n?` · ${c} correct`:'');
}
$('qs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s!==undefined){const i=+b.dataset.s;set[i]=mk(set[i].t,other(set[i].t,set[i].v))}
  else if(b.dataset.k!==undefined){set[+b.dataset.i].pick=+b.dataset.k}
  renderQ()});
$('rr').onclick=roll;

/* ---------- Simulation ---------- */
const W=560,H=340,R=6,S0=1.2;
const gs=()=>(Math.random()+Math.random()+Math.random()+Math.random()-2)*1.7;
function Sim(id,init){
  const sec=document.createElement('section');sec.className='box';
  const s=Object.assign({T:300,Ea:12,n:40,cat:false,ori:false,al:60},init);
  const sl=(k,l,mn,mx,st)=>`<label>${l}<span data-v="${k}"></span></label><input type="range" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${s[k]}">`;
  sec.innerHTML=`<div><h2 style="margin-top:0">Box ${id}</h2><canvas class="cv" width="${W}" height="${H}" aria-label="Particle box ${id}"></canvas>
  <div class="stats"><div><b data-s="col">0</b>A–B collisions</div><div><b data-s="eff">0</b>reacted</div><div><b data-s="pct">0%</b>effective</div><div><b data-s="prod">0%</b>products</div><div><b data-s="ster">–</b>energetic, aligned</div></div>
  <h2>Product formed over time</h2><canvas class="gr" width="${W}" height="100" aria-label="Product over time"></canvas></div>
  <div>${sl('T','Temperature',200,900,10)}${sl('Ea','Activation energy',5,25,1)}${sl('n','Particles of each reactant',10,80,5)}
  <div class="chk"><input type="checkbox" data-k="cat" id="cat${id}"${s.cat?' checked':''}><label for="cat${id}">Catalyst (Ea × 0.6)</label></div>
  <div class="chk"><input type="checkbox" data-k="ori" id="ori${id}"${s.ori?' checked':''}><label for="ori${id}">Require correct orientation</label></div>${sl('al','Reactive site half-angle',15,90,5)}
  <h2>Energy of each A–B collision</h2><canvas class="hi" width="420" height="160" aria-label="Collision energy histogram"></canvas>
  <p class="cap">Bars right of the line can react.</p></div>`;
  $('boxes').appendChild(sec);
  const q=x=>sec.querySelector(x),ctx=q('.cv').getContext('2d'),gx=q('.gr').getContext('2d'),hx=q('.hi').getContext('2d');
  let P=[],col=0,eff=0,en=0,ok=0,hist=[],ser=[],fr=0,curT=s.T;
  const ea=()=>s.Ea*(s.cat?.6:1);
  function reset(){curT=s.T;P=[];col=eff=en=ok=0;hist=[];ser=[];fr=0;const sp=S0*Math.sqrt(s.T/300);
    for(let i=0;i<s.n*2;i++)P.push({x:R+Math.random()*(W-2*R),y:R+Math.random()*(H-2*R),vx:gs()*sp,vy:gs()*sp,t:i%2,f:0,a:Math.random()*6.283,w:(Math.random()-.5)*.12});labels();stats()}
  function labels(){sec.querySelectorAll('[data-v]').forEach(e=>{const k=e.dataset.v;e.textContent=k==='T'?s.T+' K':k==='Ea'?s.Ea+' kJ/mol'+(s.cat?' → '+ea().toFixed(1):''):k==='al'?s.al+'° → steric ≈ '+Math.round((s.al/180)**2*100)+'%':s[k]})}
  function stats(){const pr=P.filter(p=>p.t===2).length/P.length;
    const set=(k,v)=>q(`[data-s=${k}]`).textContent=v;set('col',col);set('eff',eff);set('pct',col?Math.round(eff/col*100)+'%':'0%');set('prod',Math.round(pr*100)+'%');set('ster',en?Math.round(ok/en*100)+'%':'–');return pr}
  function step(){
    for(const p of P){p.x+=p.vx;p.y+=p.vy;p.a+=p.w;if(p.f>0)p.f--;
      if(p.x<R){p.x=R;p.vx=Math.abs(p.vx)}if(p.x>W-R){p.x=W-R;p.vx=-Math.abs(p.vx)}
      if(p.y<R){p.y=R;p.vy=Math.abs(p.vy)}if(p.y>H-R){p.y=H-R;p.vy=-Math.abs(p.vy)}}
    const e0=ea();
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
      const a=P[i],b=P[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;
      if(d2>=4*R*R||d2===0)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,vr=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(vr>=0)continue;
      if(a.t+b.t===1){const E=1.25*vr*vr/(S0*S0);col++;hist.push(E);if(hist.length>500)hist.shift();
        if(E>=e0){en++;const al=s.al*Math.PI/180,ang=(p,x,y)=>{const d=Math.atan2(y,x)-p.a;return Math.abs(Math.atan2(Math.sin(d),Math.cos(d)))<al};if(!s.ori||(ang(a,-dx,-dy)&&ang(b,dx,dy))){ok++;a.t=b.t=2;a.f=b.f=14;eff++}}}
      a.vx-=vr*nx;a.vy-=vr*ny;b.vx+=vr*nx;b.vy+=vr*ny}}
  function tick(n){for(let k=0;k<n;k++)step();fr++;if(fr%12===0){ser.push(stats());if(ser.length>300)ser.shift()}if(fr%6===0){stats();drawHist()}}
  function draw(){
    ctx.clearRect(0,0,W,H);const cs=[COL.a,COL.b,COL.c],al=s.al*Math.PI/180;
    for(const p of P){if(p.f>0){ctx.beginPath();ctx.arc(p.x,p.y,R+p.f*.8,0,7);ctx.strokeStyle=COL.c;ctx.globalAlpha=p.f/16;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1}
      ctx.beginPath();ctx.arc(p.x,p.y,R,0,7);ctx.fillStyle=cs[p.t];ctx.fill();if(s.ori&&p.t<2){ctx.beginPath();ctx.arc(p.x,p.y,R+1.5,p.a-al,p.a+al);ctx.strokeStyle=COL.ink;ctx.lineWidth=2.5;ctx.stroke()}}
    const w=560,h=100;gx.clearRect(0,0,w,h);gx.strokeStyle=COL.line;gx.strokeRect(.5,.5,w-1,h-1);
    gx.fillStyle=COL.mute;gx.font='11px sans-serif';gx.fillText('100%',4,12);gx.fillText('0',4,h-4);
    gx.beginPath();gx.strokeStyle=COL.c;gx.lineWidth=2.5;ser.forEach((v,i)=>{const x=34+i*(w-44)/300,y=h-6-v*(h-18);i?gx.lineTo(x,y):gx.moveTo(x,y)});gx.stroke()}
  function drawHist(){
    const w=420,h=160,bw=2,nb=30,bp=(w-20)/nb,e=ea();hx.clearRect(0,0,w,h);
    const bins=new Array(nb).fill(0);hist.forEach(v=>bins[Math.min(nb-1,Math.floor(v/bw))]++);const mx=Math.max(4,...bins);
    bins.forEach((c,k)=>{const r=(k+1)*bw>e;hx.globalAlpha=r?1:.45;hx.fillStyle=r?COL.c:COL.mute;const bh=c/mx*(h-40);hx.fillRect(10+k*bp+1,h-22-bh,bp-2,bh)});
    hx.globalAlpha=1;const ex=10+e/bw*bp;hx.strokeStyle=COL.ink;hx.lineWidth=2;hx.beginPath();hx.moveTo(ex,6);hx.lineTo(ex,h-22);hx.stroke();
    hx.fillStyle=COL.ink;hx.font='12px sans-serif';hx.fillText('Ea',Math.min(ex+4,w-24),16);hx.fillStyle=COL.mute;hx.fillText('0',10,h-6);hx.fillText('60 kJ/mol',w-64,h-6)}
  sec.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;
    if(e.target.type==='checkbox')s[k]=e.target.checked;else s[k]=+e.target.value;
    if(k==='T'){const f=Math.sqrt(s.T/curT);P.forEach(p=>{p.vx*=f;p.vy*=f});curT=s.T}
    if(k==='n'){reset()}else{hist=[];en=ok=0}labels();drawHist()});
  reset();drawHist();
  return{s,sec,tick,draw,reset}
}
let sims=[Sim(1)],paused=false;
function layout(){$('boxes').className='boxes '+(sims.length>1?'two':'one');$('add').textContent=sims.length>1?'Remove second box':'Add second box'}
$('add').onclick=()=>{if(sims.length>1){sims.pop().sec.remove()}else{sims.push(Sim(2,{...sims[0].s}))}layout()};
$('ra').onclick=()=>sims.forEach(s=>s.reset());
$('pz').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};
$('spd').oninput=()=>$('spv').textContent=$('spd').value+'×';$('spv').textContent='2×';

/* ---------- Tabs & loop ---------- */
function tab(n){[1,2].forEach(i=>{$('t'+i).setAttribute('aria-selected',i===n);$('p'+i).hidden=i!==n})}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
function drawCU(){const x=$('cuc').getContext('2d'),al=sims[0].s.al,A=+$('cuA').value,B=+$('cuB').value,r=Math.PI/180;
$('cuAv').textContent=A+'°';$('cuBv').textContent=B+'°';x.clearRect(0,0,560,170);
const d=(v,t)=>{const q=(v-t)*r;return Math.abs(Math.atan2(Math.sin(q),Math.cos(q)))/r};
const okA=d(A,0)<=al,okB=d(B,180)<=al;
[[170,A,COL.a,'A'],[390,B,COL.b,'B']].forEach(([cx,g,cl,n])=>{x.beginPath();x.arc(cx,85,38,0,7);x.fillStyle=cl;x.fill();x.beginPath();x.arc(cx,85,43,(g-al)*r,(g+al)*r);x.strokeStyle=COL.ink;x.lineWidth=6;x.stroke();x.fillStyle=COL.invert;x.font='600 18px sans-serif';x.textAlign='center';x.fillText(n,cx,91)});
x.strokeStyle=COL.mute;x.lineWidth=2;x.setLineDash([5,5]);x.beginPath();x.moveTo(222,85);x.lineTo(338,85);x.stroke();x.setLineDash([]);
$('cuv').textContent=okA&&okB?'Both reactive sites face the collision line, so a collision with enough energy can react.':'The reactive sites miss each other, so the molecules bounce apart even with enough energy. With a '+al+'° site, random molecules line up only about '+Math.round((al/180)**2*100)+'% of the time. That fraction is the steric factor.'}
function loop(){if(!$('p2').hidden){sims.forEach(s=>{if(!paused)s.tick(+$('spd').value);s.draw()});if($('cu').open)drawCU()}requestAnimationFrame(loop)}
roll();layout();loop();
</script>
